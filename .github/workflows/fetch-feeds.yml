name: Fetch feeds

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch feeds and build CSV
        run: python scripts/fetch_feeds.py

      - name: Save the CSV in the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/guardian_feeds.csv
          if git diff --cached --quiet; then
            echo "No change to save."
          else
            git commit -m "Update feeds data"
            git pull --rebase
            git push
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: feeds-csv
          path: site/guardian_feeds.csv
          retention-days: 14

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
        with:
          timeout: 180000
