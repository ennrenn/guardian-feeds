name: Fetch feeds

on:
  # The "Run workflow" button on the Actions tab.
  workflow_dispatch:
  # To refresh automatically as well, remove the # from the next two lines.
  # The time is UTC. This example runs every day at 05:17.
  # schedule:
  #   - cron: "17 5 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch feeds and build CSV
        run: python scripts/fetch_feeds.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
